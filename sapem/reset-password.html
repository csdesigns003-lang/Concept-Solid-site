<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Password - SapEM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "Microsoft Sans Serif", Arial, sans-serif; background: #f5f7fb; }
    .hero { background: linear-gradient(120deg, #004b00, #006400, #228B22); }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="hero text-white py-24">
    <div class="max-w-5xl mx-auto px-6 text-center">
      <h1 class="text-5xl font-bold mb-6">Set New Password</h1>
      <p class="text-xl opacity-90">Choose a strong password for your account.</p>
    </div>
  </section>

  <!-- FORM -->
  <section class="max-w-4xl mx-auto px-6 py-24">
    <div class="bg-white rounded-xl shadow p-12 max-w-md mx-auto">

      <h2 class="text-3xl font-bold mb-8 text-center">New Password</h2>

      <form id="newPassForm" class="space-y-6" novalidate>
        <div>
          <label class="block text-sm font-semibold mb-2">New Password</label>
          <input id="password" type="password" placeholder="Min. 8 characters"
            class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#006400]">
          <p id="pw-error" class="text-red-600 text-xs mt-1 hidden">Password must be at least 8 characters.</p>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-2">Confirm New Password</label>
          <input id="confirm" type="password" placeholder="Re-enter password"
            class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#006400]">
          <p id="confirm-error" class="text-red-600 text-xs mt-1 hidden">Passwords do not match.</p>
        </div>

        <button type="submit" id="submitBtn"
          class="w-full bg-[#006400] text-white py-3 rounded-lg font-semibold hover:bg-[#004b00]">
          Update Password
        </button>
      </form>

    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script>
    // Supabase fires this event when it detects a recovery token in the URL
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        // Session is now active — user can update their password
        console.log("Recovery session active")
      }
    })

    document.getElementById("newPassForm").addEventListener("submit", async function(e) {
      e.preventDefault()

      const password = document.getElementById("password").value
      const confirm  = document.getElementById("confirm").value
      const pwErr    = document.getElementById("pw-error")
      const cfmErr   = document.getElementById("confirm-error")
      const btn      = document.getElementById("submitBtn")

      pwErr.classList.add("hidden")
      cfmErr.classList.add("hidden")

      let valid = true
      if (password.length < 8) { pwErr.classList.remove("hidden");  valid = false }
      if (password !== confirm) { cfmErr.classList.remove("hidden"); valid = false }
      if (!valid) return

      btn.disabled    = true
      btn.textContent = "Updating…"

      const ok = await updatePassword(password)

      if (ok) {
        alert("Password updated! Please log in.")
        window.location.href = "login.html"
      } else {
        btn.disabled    = false
        btn.textContent = "Update Password"
      }
    })
  </script>

</body>
</html>
